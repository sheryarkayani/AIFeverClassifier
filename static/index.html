<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fever Classifier</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>AI Fever Classifier</h1>
            <p>Advanced Diagnostics Powered by Machine Learning</p>
        </header>

        <main>
            <div class="card glass">
                <form id="diagnosisForm">
                    <div class="form-grid">
                        <!-- Demographics -->
                        <div class="input-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" required min="1" max="120" placeholder="e.g. 30">
                        </div>
                        <div class="input-group">
                            <label for="sex">Sex</label>
                            <select id="sex" required>
                                <option value="1">Male</option>
                                <option value="0">Female</option>
                            </select>
                        </div>

                        <!-- Vitals & Lab -->
                        <div class="input-group">
                            <label for="temperature">Temperature (°C)</label>
                            <input type="number" id="temperature" required step="0.1" placeholder="e.g. 38.5">
                        </div>
                        <div class="input-group">
                            <label for="wbc">White Blood Cells</label>
                            <input type="number" id="wbc" required placeholder="e.g. 5000">
                        </div>
                        <div class="input-group">
                            <label for="platelets">Platelets</label>
                            <input type="number" id="platelets" required placeholder="e.g. 200000">
                        </div>

                        <!-- Symptoms -->
                        <div class="input-group">
                            <label for="headache">Headache</label>
                            <select id="headache" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="joint_pain">Joint Pain</label>
                            <select id="joint_pain" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="rash">Rash</label>
                            <select id="rash" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>

                        <!-- History -->
                        <div class="input-group">
                            <label for="travel">Travel to Hot Area</label>
                            <select id="travel" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="mosquito">Mosquito Exposure</label>
                            <select id="mosquito" required>
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-primary">
                        <span>Diagnose Patient</span>
                    </button>
                </form>
            </div>

            <div id="resultCard" class="card glass result hidden">
                <h2>Diagnosis Result</h2>
                <div class="prediction-box">
                    <span id="predictionLabel">Prediction:</span>
                    <strong id="predictionValue" class="highlight">---</strong>
                </div>

                <div class="probabilities">
                    <h3>Confidence Scores</h3>
                    <div id="probList"></div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 AI Medical Diagnostics</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
